services:
  - type: web
    name: wealthfolio-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    plan: starter
    envVars:
      - key: WF_LISTEN_ADDR
        value: 0.0.0.0:8080
      - key: WF_STORAGE_BACKEND
        sync: false
      - key: WF_DB_PATH
        value: /data/wealthfolio.db
      - key: WF_STATIC_DIR
        value: dist
      - key: WF_REQUEST_TIMEOUT_MS
        value: 30000
      - key: WF_COOKIE_SECURE
        value: auto
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: WF_CORS_ALLOW_ORIGINS
        sync: false
      - key: WF_SECRET_KEY
        generateValue: true
      - key: WF_AUTH_PASSWORD_HASH
        sync: false
      - key: WF_ORUS_AUTH
        value: true
      - key: ORUS_SUPABASE_URL
        sync: false
      - key: ORUS_SUPABASE_ANON_KEY
        sync: false
      - key: WF_AUTH_REQUIRED
        sync: false
      - key: CONNECT_API_URL
        sync: false
      - key: CONNECT_AUTH_URL
        sync: false
      - key: CONNECT_AUTH_PUBLISHABLE_KEY
        sync: false
      - key: SNAPTRADE_CLIENT_ID
        sync: false
      - key: SNAPTRADE_CONSUMER_KEY
        sync: false
    disk:
      name: wealthfolio-data
      mountPath: /data
      sizeGB: 10
