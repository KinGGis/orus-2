[package]
name = "wealthfolio-storage-postgres"
version.workspace = true
edition.workspace = true
description = "PostgreSQL storage implementation for Wealthfolio"
authors = ["Aziz Fadil"]
license = "AGPL-3.0"

[features]
default = []

[dependencies]
# Internal crates
wealthfolio-core = { workspace = true }
wealthfolio-connect = { workspace = true }
wealthfolio-ai = { workspace = true }

# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
async-trait = { workspace = true }
rust_decimal = { workspace = true }
bigdecimal = "0.4"

# PostgreSQL / Diesel
diesel = { version = "2.2", features = ["postgres", "chrono", "r2d2", "numeric", "uuid", "serde_json"] }
diesel_migrations = "2.2"
r2d2 = { workspace = true }

# Secret encryption at rest (parity with the file-based secret store)
chacha20poly1305 = { workspace = true }
rand = { workspace = true }
base64 = "0.21"

[lints]
workspace = true
